        <small class="kicker">Mary’s exam</small>
        <h1>Simulation Licensure Exam</h1>
        <p class="big-date">Wednesday · 18 November 2026</p>
        <p>MSR – Israel Center for Medical Simulation, Tel HaShomer</p>
      </div>
    </section>
    <div class="cards2">
      <article class="card info">
        <h2><img src="img/sim.webp" alt="">What it is</h2>
        <p>The Ministry of Health’s licensing exam for <b>new immigrant registered nurses</b> with long experience abroad. It <b>assesses how you perform and manage patient care in simulated patient cases</b>, plus one 30-question knowledge station.</p>
        <ul>
          <li>Languages: English, French, <b>Spanish</b>, Russian or Hebrew.</li>
          <li>It is based on the <b>mandatory reading list</b> for <a href="https://www1.health.gov.il/media/rhlpeh1n/literaturelist-sep-dec-2026.pdf" target="_blank" rel="noopener">September–December 2026</a>. Everything in this app follows that list (including <b>CPR by AHA 2025</b>).</li>
          <li>Your invitation with the exact time appears in the portal about <b>two weeks before</b>. Print it and bring it with your ID.</li>
          <li><b>Official format</b> (Ministry briefing, 24.10.2026): <b>5 stations × 15 minutes</b>, an interpreter in every station. 1 internal medicine · 2 adult surgical · 3 child · 4 women’s health (conversation and teaching with an actor) · 5 a 30-question knowledge test (mental health, pharmacology, laws and circulars, calculations). Pass mark <b>60</b>, all stations combined. Practise it in <a href="#/mocks">Unit 9’s mock tests</a>.</li>
          <li>The official outline of the RN exam includes <b>pharmacological calculations</b>, so dose and rate calculations are practised at the bedside in the app.</li>
        </ul>
      </article>
      <article class="card info">
        <h2><img src="img/target.webp" alt="">How MSR runs simulation licensing exams</h2>
        <p>For its other nursing licensing exams, MSR uses <b>6–8 stations</b> of <b>5–20 minutes</b>, in a different order for each candidate:</p>
        <ul>
          <li><b>Mannequin station:</b> an evolving acute patient; assess, act, then answer the examiner’s fixed questions.</li>
          <li><b>Procedure station:</b> one procedure or protocol in about 5 minutes.</li>
          <li><b>Actor station:</b> a patient or family member (history, teaching, a difficult conversation), watched through a one-way window, then a <b>debrief</b> with the examiner.</li>
          <li><b>Computer case:</b> a case on screen with typed answers.</li>
        </ul>
        <p class="muted">These are MSR’s published formats for other exams. Mary’s exam may differ; the app’s <a href="#/stations">Stations</a> practise all of them.</p>
      </article>
      <article class="card info">
        <h2><img src="img/lock.webp" alt="">Red lines: say them out loud in every station</h2>
        <ol>
          <li><b>Hand hygiene</b> on entering and leaving.</li>
          <li><b>Introduce yourself</b>, name and role.</li>
          <li><b>Identify</b> the patient with 2 identifiers (name + ID number) against the wristband, before any care or drug.</li>
          <li><b>Explain</b> and ask for agreement; <b>privacy</b>.</li>
          <li><b>Allergies</b> before any drug.</li>
          <li>Never leave an unstable patient; <b>call for help</b> and hand over with <b>SBAR</b>.</li>
          <li>On leaving: <b>bed low, rails as needed, call bell in reach</b>; <b>document</b>.</li>
        </ol>
      </article>
      <article class="card info">
        <h2><img src="img/calendar.webp" alt="">The day at MSR</h2>
        <p class="muted">From MSR’s rules for its licensing exams. Check your own invitation for anything different.</p>
        <ul>
          <li>Arrive at the time in the invitation: <b>latecomers are not admitted</b>.</li>
          <li>Bring an <b>ID document</b>; come in <b>uniform (scrubs, or trousers and shirt)</b>.</li>
          <li>Phones are switched off and handed to MSR staff. You get a briefing, a badge and ID stickers.</li>
          <li>No talking with other candidates between stations.</li>
          <li>Tell the licensing department at least a week before about any medical issue that may affect you.</li>
          <li>Results by SMS and on the portal, within 30 working days.</li>
        </ul>
      </article>
      <article class="card info">
        <h2><img src="img/steth.webp" alt="">How to shine in a simulation</h2>
        <p class="muted">General simulation-exam habits. They are not official rules for this exam.</p>
        <ol>
          <li><b>Safety first:</b> hand hygiene, introduce yourself, check identity with 2 identifiers, check allergies.</li>
          <li><b>Assess before you act</b> (unless the patient is crashing): ABCDE, vital signs, glucose when the patient is confused.</li>
          <li><b>Prioritize out loud:</b> “Airway first…”. Examiners can’t score what they can’t see.</li>
          <li><b>Call for help early</b> and hand over with <b>SBAR</b>.</li>
          <li><b>Re-assess</b> after every intervention.</li>
          <li><b>Talk to the patient and family</b>: calm, honest, no false reassurance, use an interpreter if needed.</li>
          <li><b>Document</b>: what, when, the response, and who you informed.</li>
        </ol>
      </article>
      <article class="card info">
        <h2><img src="img/books.webp" alt="">Mary’s reading list (Sept–Dec 2026)</h2>
        <ul>
          <li>6 textbooks: Kozier &amp; Erb (Fundamentals), Brunner &amp; Suddarth (Med-Surg, 15th ed.), Wong (Pediatrics), Olds (Maternal-Newborn), Townsend (Psychiatry), Nursing Drug Handbook 2025-2026.</li>
          <li>AHA 2025: Adult BLS. AHA/Red Cross 2024: First Aid.</li>
          <li>Laws on patient rights (Patient’s Rights, Dying Patient, Mental Health…) and on nursing practice.</li>
          <li>50 Nursing Division circulars, 11 Director-General circulars, 10 Medical Administration circulars, the Nurses’ Code of Ethics and the MOH immunization guide.</li>
        </ul>
      </article>
      <article class="card info">
        <h2><img src="img/check.webp" alt="">How this app's content was checked</h2>
        <ul>
          <li><b>Laws and Ministry circulars:</b> checked against the official texts linked in Mary's reading list (Patient's Rights, Dying Patient, Mental Health and Penal laws; the Nursing Division circulars). This caught and fixed the adult epinephrine dose (0.3 mg, circular 204/2023) and the oxygen rule for COPD (circular 127/2017).</li>
          <li><b>CPR and first aid:</b> checked against the AHA Adult BLS guideline texts (2020, and 2025 for what changed: choking and infant compressions) and the AHA/Red Cross first-aid guidance.</li>
          <li><b>Textbooks:</b> no full copies were used (they are paid and copyrighted). <b>Brunner &amp; Suddarth 16th ed.</b> and <b>Wong's 12th ed.</b> can be searched inside on Google Books, so their key facts were checked in the books' own text (e.g. ACC/AHA blood-pressure table p.764, heart-failure weight gain p.681, nitroglycerin and low BP p.644, infant honey/botulism p.1354, Kawasaki p.991). <b>Kozier, Olds, Townsend and the Drug Handbook</b> cannot be searched online, so their topics were checked against open references (CDC, ACC/AHA, current guidelines). Each answer says which applies.</li>
          <li>Commercial Hebrew question banks (e.g. medexams.co.il, which uses Brunner & Suddarth 16th ed.) are paid. Their questions are not copied here.</li>
        </ul>
      </article>
      <article class="card info">
        <h2><img src="img/bulb.webp" alt="">Good to know</h2>
        <ul>
          <li>On the Ministry calendar, <b>18.11.26</b> is the only simulation exam for immigrants. (The 23.11.26 date at MSR is a forensic-nursing exam, not Mary’s.)</li>
          <li>Eligibility (Ministry letter, January 2026): more than 3 years of experience in a general hospital or a primary community clinic abroad.</li>
          <li>Questions about the exam format: <b>siud.test@moh.gov.il</b>.</li>
          <li>After passing, a temporary work permit is valid for 3 years. Hebrew proficiency must be proven within that time, so keep going with the Hebrew lessons.</li>
          <li>Questions about eligibility go to the Nursing Division Certification Department, phone *5400.</li>
        </ul>
        <p class="links">
          <a href="https://www1.health.gov.il/en/nursing/catch-up/conferences-events/registered-nurse-licensure-exams/exam-for-new-immigrants-2/" target="_blank" rel="noopener">Official exam page ↗</a>

        </p>
      </article>
    </div>

  <template id="exam-es">
    <section class="exam-hero card pop">
      <img src="img/mary.webp" alt="" class="float">
      <div>
        <small class="kicker">El examen de Mary</small>
        <h1>Examen de licencia por simulación</h1>
        <p class="big-date">Miércoles · 18 de noviembre de 2026</p>
        <p>MSR – Centro Israelí de Simulación Médica, Tel HaShomer</p>
      </div>
    </section>
    <div class="cards2">
      <article class="card info">
        <h2><img src="img/sim.webp" alt="">Qué es</h2>
        <p>El examen de licencia del Ministerio de Salud para <b>enfermeras inmigrantes</b> con larga experiencia en el extranjero. <b>Evalúa cómo realizas y gestionas el cuidado del paciente en casos simulados</b>, además de una estación de conocimientos de 30 preguntas.</p>
        <ul>
          <li>Idiomas: inglés, francés, <b>español</b>, ruso o hebreo.</li>
          <li>Se basa en la <b>bibliografía obligatoria</b> de <a href="https://www1.health.gov.il/media/rhlpeh1n/literaturelist-sep-dec-2026.pdf" target="_blank" rel="noopener">septiembre–diciembre 2026</a>. Todo en esta app sigue esa lista (incluida la <b>RCP según AHA 2025</b>).</li>
          <li>La invitación con la hora exacta aparece en el portal unas <b>dos semanas antes</b>. Imprímela y llévala con tu documento de identidad.</li>
          <li><b>Formato oficial</b> (sesión del Ministerio, 24.10.2026): <b>5 estaciones × 15 minutos</b>, con intérprete en cada una. 1 medicina interna · 2 cirugía del adulto · 3 niño · 4 salud de la mujer (conversación y educación con una actriz) · 5 una prueba de conocimientos de 30 preguntas (salud mental, farmacología, leyes y circulares, cálculos). Aprobado con <b>60</b>, todas las estaciones combinadas. Practícalo en <a href="#/mocks">los exámenes de prueba de la Unidad 9</a>.</li>
          <li>El temario oficial del examen de RN incluye <b>cálculos farmacológicos</b>, así que en la app se practican cálculos de dosis y ritmos a pie de cama.</li>
        </ul>
      </article>
      <article class="card info">
        <h2><img src="img/target.webp" alt="">Cómo hace MSR los exámenes de simulación</h2>
        <p>En sus otros exámenes de licencia de enfermería, MSR usa <b>6–8 estaciones</b> de <b>5–20 minutos</b>, en distinto orden para cada candidato:</p>
        <ul>
          <li><b>Estación con maniquí:</b> un paciente agudo que evoluciona; valorar, actuar y responder las preguntas fijas del examinador.</li>
          <li><b>Estación de procedimiento:</b> un procedimiento o protocolo en unos 5 minutos.</li>
          <li><b>Estación con actor:</b> paciente o familiar (anamnesis, educación, conversación difícil), observada tras un espejo, y luego un <b>interrogatorio</b> con el examinador.</li>
          <li><b>Caso en ordenador:</b> un caso en pantalla con respuestas escritas.</li>
        </ul>
        <p class="muted">Son los formatos publicados por MSR para otros exámenes. El de Mary puede variar; las <a href="#/stations">Estaciones</a> de la app los practican todos.</p>
      </article>
      <article class="card info">
        <h2><img src="img/lock.webp" alt="">Líneas rojas: dilas en voz alta en cada estación</h2>
        <ol>
          <li><b>Higiene de manos</b> al entrar y al salir.</li>
          <li><b>Preséntate</b>: nombre y función.</li>
          <li><b>Identifica</b> al paciente con 2 datos (nombre + número de ID) frente a la pulsera, antes de cualquier cuidado o fármaco.</li>
          <li><b>Explica</b> y pide conformidad; <b>intimidad</b>.</li>
          <li><b>Alergias</b> antes de cualquier fármaco.</li>
          <li>Nunca dejes solo a un paciente inestable; <b>pide ayuda</b> y comunica con <b>SBAR</b>.</li>
          <li>Al salir: <b>cama baja, barandillas según necesidad, timbre a mano</b>; <b>registra</b>.</li>
        </ol>
      </article>
      <article class="card info">
        <h2><img src="img/calendar.webp" alt="">El día en MSR</h2>
        <p class="muted">Según las normas de MSR para sus exámenes de licencia. Revisa tu invitación por si algo cambia.</p>
        <ul>
          <li>Llega a la hora de la invitación: <b>no se admite a quien llega tarde</b>.</li>
          <li>Lleva un <b>documento de identidad</b>; ven con <b>uniforme (pijama clínico, o pantalón y camisa)</b>.</li>
          <li>Los móviles se apagan y se entregan al personal de MSR. Hay una explicación inicial, una acreditación y etiquetas.</li>
          <li>No se habla con otros candidatos entre estaciones.</li>
          <li>Avisa al departamento de exámenes al menos una semana antes de cualquier problema médico que pueda afectarte.</li>
          <li>Resultados por SMS y en el portal, en 30 días laborables.</li>
        </ul>
      </article>
      <article class="card info">
        <h2><img src="img/steth.webp" alt="">Cómo brillar en una simulación</h2>
        <p class="muted">Buenas prácticas generales en exámenes de simulación. No son reglas oficiales de este examen.</p>
        <ol>
          <li><b>Seguridad primero:</b> higiene de manos, presentarte, identidad con 2 identificadores, alergias.</li>
          <li><b>Valora antes de actuar</b> (salvo que el paciente se desplome): ABCDE, constantes y glucemia si está confuso.</li>
          <li><b>Prioriza en voz alta:</b> “Primero la vía aérea…”. Lo que no se ve no se puntúa.</li>
          <li><b>Pide ayuda pronto</b> y comunica con <b>SBAR</b>.</li>
          <li><b>Revalora</b> tras cada intervención.</li>
          <li><b>Habla con el paciente y la familia</b>: con calma y honestidad, sin falsas promesas, con intérprete si hace falta.</li>
          <li><b>Documenta</b>: qué, cuándo, la respuesta y a quién avisaste.</li>
        </ol>
      </article>
      <article class="card info">
        <h2><img src="img/books.webp" alt="">La bibliografía de Mary (sept–dic 2026)</h2>
        <ul>
          <li>6 libros: Kozier &amp; Erb (Fundamentos), Brunner &amp; Suddarth (Médico-quirúrgica, 15.ª ed.), Wong (Pediatría), Olds (Materno-neonatal), Townsend (Psiquiatría), Nursing Drug Handbook 2025-2026.</li>
          <li>AHA 2025: SVB del adulto. AHA/Cruz Roja 2024: primeros auxilios.</li>
          <li>Leyes sobre derechos del paciente (Derechos del Paciente, Paciente Terminal, Salud Mental…) y sobre el ejercicio de la enfermería.</li>
          <li>50 circulares de la División de Enfermería, 11 de la Dirección General, 10 de la Dirección Médica, el Código Ético y la guía de vacunación.</li>
        </ul>
      </article>
      <article class="card info">
        <h2><img src="img/check.webp" alt="">Cómo se verificó el contenido</h2>
        <ul>
          <li><b>Leyes y circulares del Ministerio:</b> verificadas con los textos oficiales enlazados en la bibliografía de Mary (leyes de Derechos del Paciente, Paciente Terminal, Salud Mental y Código Penal; circulares de la División de Enfermería). Así se corrigieron la dosis de adrenalina del adulto (0,3 mg, circular 204/2023) y la norma de oxígeno en EPOC (circular 127/2017).</li>
          <li><b>RCP y primeros auxilios:</b> verificados con los textos de la guía AHA de SVB del adulto (2020, y 2025 en lo que cambió: atragantamiento y compresiones en lactantes) y las guías de primeros auxilios de AHA/Cruz Roja.</li>
          <li><b>Libros:</b> no se usaron copias completas (son de pago y con derechos de autor). <b>Brunner &amp; Suddarth 16.ª ed.</b> y <b>Wong 12.ª ed.</b> permiten buscar dentro en Google Books, así que sus datos clave se verificaron en el propio texto (p. ej. tabla de presión arterial ACC/AHA p.764, aumento de peso en insuficiencia cardiaca p.681, nitroglicerina y PA baja p.644, miel y botulismo infantil p.1354, Kawasaki p.991). <b>Kozier, Olds, Townsend y el Drug Handbook</b> no se pueden buscar en línea, así que sus temas se verificaron con referencias abiertas (CDC, ACC/AHA, guías actuales). Cada respuesta indica cuál aplica.</li>
          <li>Los bancos comerciales de preguntas en hebreo (p. ej. medexams.co.il, que usa Brunner & Suddarth 16.ª ed.) son de pago. Sus preguntas no se copian aquí.</li>
        </ul>
      </article>
      <article class="card info">
        <h2><img src="img/bulb.webp" alt="">Conviene saber</h2>
        <ul>
          <li>En el calendario del Ministerio, el <b>18.11.26</b> es el único examen de simulación para inmigrantes. (La fecha 23.11.26 en MSR es un examen de enfermería forense, no el de Mary.)</li>
          <li>Requisitos (carta del Ministerio, enero 2026): más de 3 años de experiencia en un hospital general o una clínica comunitaria de atención primaria en el extranjero.</li>
          <li>Preguntas sobre el formato del examen: <b>siud.test@moh.gov.il</b>.</li>
          <li>Al aprobar se obtiene un permiso temporal de 3 años. En ese plazo hay que acreditar el hebreo, así que sigue con las lecciones de hebreo.</li>
          <li>Dudas de elegibilidad: Departamento de Certificación de la División de Enfermería, teléfono *5400.</li>
        </ul>
        <p class="links">
          <a href="https://www1.health.gov.il/en/nursing/catch-up/conferences-events/registered-nurse-licensure-exams/exam-for-new-immigrants-2/" target="_blank" rel="noopener">Página oficial ↗</a>

        </p>
      </article>
